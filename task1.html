<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a train ticket</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 card-container">
                <form class="p-4 p-md-5 rounded-4 shadow-sm bg-white" autocomplete="off">
                    <div class="header-banner text-white p-4 rounded-3 mb-4">
                        <h2 class="mb-0 fw-bold">Book a train ticket</h2>
                    </div>
                    <div class="mb-4">
                        <div class="btn-group trip-type-group w-100 w-md-auto" role="group" aria-label="Trip Type">
                            <input type="radio" class="btn-check" name="tripType" id="oneway" autocomplete="off" checked>
                            <label class="btn btn-outline-custom px-4 py-2" for="oneway">One way</label>
                            <input type="radio" class="btn-check" name="tripType" id="roundtrip" autocomplete="off">
                            <label class="btn btn-outline-custom px-4 py-2" for="roundtrip">Round trip</label>
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="fromCity" class="form-label fw-semibold text-muted small">From</label>
                            <input type="text" class="form-control custom-input" id="fromCity" value="Astana" required>
                        </div>
                        <div class="col-md-6">
                            <label for="toCity" class="form-label fw-semibold text-muted small">To</label>
                            <input type="text" class="form-control custom-input" id="toCity" value="Almaty" required>
                        </div>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="departureDate" class="form-label fw-semibold text-muted small">Departure</label>
                            <input type="date" class="form-control custom-input" id="departureDate" required>
                        </div>
                        <div class="col-md-4">
                            <label for="returnDate" class="form-label fw-semibold text-muted small">Return</label>
                            <input type="date" class="form-control custom-input" id="returnDate">
                        </div>
                        <div class="col-md-4">
                            <label for="passengers" class="form-label fw-semibold text-muted small">Passengers</label>
                            <select class="form-select custom-input" id="passengers" required>
                                <option value="1" selected>1 adult</option>
                                <option value="2">2 adults</option>
                                <option value="3">3 adults</option>
                                <option value="4">4 adults</option>
                                <option value="5">5 adults</option>
                                <option value="6">6 adults</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-muted small d-block">Carriage class</label>
                        <div class="d-flex flex-wrap gap-4 mt-2">
                            <div class="form-check">
                                <input class="form-check-input custom-radio" type="radio" name="carriageClass" id="seat" required>
                                <label class="form-check-label fw-medium" for="seat">Seat</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input custom-radio" type="radio" name="carriageClass" id="coupe" required>
                                <label class="form-check-label fw-medium" for="coupe">Coupé</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input custom-radio" type="radio" name="carriageClass" id="sleeper" required>
                                <label class="form-check-label fw-medium" for="sleeper">Sleeper</label>
                            </div>
                        </div>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold text-muted small">Phone</label>
                            <div class="input-group">
                                <span class="input-group-text bg-custom-light text-success fw-bold">+7</span>
                                <input type="tel" class="form-control custom-input" id="phone" placeholder="701 234 56 78" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold text-muted small">Email</label>
                            <input type="email" class="form-control custom-input" id="email" placeholder="name@example.com" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <div class="form-check mb-2">
                            <input class="form-check-input custom-checkbox" type="checkbox" id="smsCheck">
                            <label class="form-check-label text-secondary small" for="smsCheck">Also send the ticket by SMS</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input custom-checkbox" type="checkbox" id="rulesCheck" required>
                            <label class="form-check-label text-secondary small" for="rulesCheck">I agree with the carriage rules</label>
                        </div>
                    </div>
                    <div class="d-flex flex-column-reverse flex-md-row justify-content-end gap-3 mt-4">
                        <button type="reset" class="btn btn-outline-custom-secondary px-5 py-2 rounded-pill">Clear</button>
                        <button type="submit" class="btn btn-custom-warning px-5 py-2 rounded-pill text-white fw-semibold">Find trains</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
