<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Reservation - Café</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #F4F7F5; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <form class="p-4 p-md-5 rounded-4 shadow-sm bg-white">
                    <h2 class="fw-bold mb-4 text-dark">Reserve a table</h2>
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Your name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label fw-semibold">Phone</label>
                        <input type="tel" class="form-control" id="phone" required>
                    </div>
                    <div class="mb-3">
                        <label for="guests" class="form-label fw-semibold">Guests</label>
                        <input type="number" class="form-control" id="guests" min="1" max="20" value="2" required>
                    </div>
                    <div class="mb-3">
                        <label for="reservationDate" class="form-label fw-semibold">Date</label>
                        <input type="date" class="form-control" id="reservationDate" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold d-block">Seating</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="seating" id="seatingInside" value="Inside" checked>
                            <label class="form-check-label" for="seatingInside">Inside</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="seating" id="seatingTerrace" value="Terrace">
                            <label class="form-check-label" for="seatingTerrace">Terrace</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="mealTime" class="form-label fw-semibold">Meal time</label>
                        <select class="form-select" id="mealTime" required>
                            <option value="" disabled selected>Choose meal...</option>
                            <option value="Lunch">Lunch</option>
                            <option value="Dinner">Dinner</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="comments" class="form-label fw-semibold">Comments</label>
                        <textarea class="form-control" id="comments" rows="3"></textarea>
                    </div>
                    <div class="mb-4 form-check">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label" for="terms">I agree to the terms</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Reserve</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
